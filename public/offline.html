<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>연결 없음 · 오샘재가복지센터</title>
<style>
  body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:#FAF5EC;color:#26302A;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px}
  .box{max-width:420px;text-align:center}
  h1{font-size:19px;color:#1E3327;margin:0 0 12px}
  p{font-size:14px;color:#5B6459;line-height:1.75;margin:0 0 10px}
  .hint{background:#FBEAD9;border:1px solid #E4C79A;border-radius:12px;padding:14px 16px;
        font-size:13px;color:#8A4B24;line-height:1.7;margin-top:16px;text-align:left}
  button{margin-top:18px;font-family:inherit;font-size:14px;font-weight:600;padding:11px 22px;
         border-radius:100px;border:none;background:#1E3327;color:#fff;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <h1>연결되지 않았습니다</h1>
    <p>인터넷 신호가 잡히지 않아 이 화면을 불러오지 못했습니다.</p>
    <div class="hint">
      작성 중이던 욕구사정 내용은 <strong>기기에 저장돼 있습니다.</strong>
      신호가 잡히면 자동으로 전송되니 안심하셔도 됩니다.
    </div>
    <button onclick="location.reload()">다시 시도</button>
    <p style="margin-top:18px">
      <a href="/assessment/offline" style="color:#1E3327;font-size:13.5px">
        신규 어르신 욕구사정은 지금 바로 작성할 수 있습니다 →
      </a>
    </p>
  </div>
</body>
</html>
