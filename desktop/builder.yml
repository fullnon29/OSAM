appId: com.osamcare.documents
productName: 오샘 서류 정리 도구
# 번들한 코드와 화면 파일만 담습니다. 프로젝트 소스와 .env.local 은 넣지 않습니다.
directories:
  # 바탕화면은 동기화 대상이라 빌드 중 파일이 잠깁니다. 동기화 밖에 만듭니다.
  output: C:/osam-dist
  buildResources: desktop
files:
  # dist 안의 파일들이 그대로 최상위로 들어갑니다.
  # 그래서 desktop/package.json 의 main 이 "main.js" 여야 합니다.
  - from: desktop/dist
    to: .
    filter: ["**/*"]
  - from: desktop
    to: .
    filter: ["package.json"]
extraMetadata:
  main: main.js
  # 새 기능이 들어간 판을 구별하려고 올립니다.
  # 0.7.0 — RFID 전송내역을 기준표와 맞추는 기능
  # 0.7.1 — 포털 최신만 받기, 메모리 crash 수정
  # 0.7.2 — 업무수행일지 6항·7항 → 욕구사정 총평 반영
  # 0.7.3 — 작성일자 범위로 일지 받기
  version: 0.7.3
electronVersion: "43.4.1"
win:
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: 오샘서류정리도구-${version}.exe
