appId: com.osamcare.documents
productName: 오샘 서류 정리 도구
# 번들된 코드와 화면 파일만 담습니다. 프로젝트 소스나 .env.local 은 넣지 않습니다.
directories:
  # 바탕화면은 동기화 대상이라 빌드 중 파일이 잠깁니다. 동기화 밖에 만듭니다.
  output: C:/osam-build/release
  buildResources: desktop
files:
  # dist 안의 파일이 꾸러미 최상위로 들어갑니다.
  # 그래서 desktop/package.json 의 main 도 "main.js" 여야 합니다.
  - from: desktop/dist
    to: .
    filter: ["**/*"]
  - from: desktop
    to: .
    filter: ["package.json"]
extraMetadata:
  main: main.js
  # 새 기능(공단 포털 받기)이 들어간 판을 구별하기 위해 올립니다.
  version: 0.5.2
win:
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: 오샘서류정리도구-${version}.exe
